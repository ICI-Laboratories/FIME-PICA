version: '3.8'

services:
  # 1. Base de Datos PostgreSQL (Privada / Sin puertos expuestos al host)
  postgres:
    image: postgres:15-alpine
    container_name: student-hub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-pica_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_pass}
    networks:
      - student-hub-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/import_horarios.sql:/docker-entrypoint-initdb.d/02-import.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Sessions (Privado / Sin puertos expuestos al host)
  redis:
    image: redis:7-alpine
    container_name: student-hub-redis
    restart: always
    networks:
      - student-hub-network
    volumes:
      - redis_data:/data

  # 3. Auth Service (Privado / Sin puertos expuestos al host)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: student-hub-auth-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      JWT_SECRET: ${JWT_SECRET:-pica-student-hub-jwt-prod-2026}
    networks:
      - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Professors Service (Privado / Sin puertos expuestos al host)
  professors-service:
    build:
      context: ./services/professors-service
      dockerfile: Dockerfile
    container_name: student-hub-professors-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      JWT_SECRET: ${JWT_SECRET:-pica-student-hub-jwt-prod-2026}
      CV_EXTRACTOR_URL: http://cv-extractor-service:6774
      REFERENCE_SERVICE_URL: http://reference-service:6773
    networks:
      - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Academic Service (Privado / Sin puertos expuestos al host)
  academic-service:
    build:
      context: ./services/academic-service
      dockerfile: Dockerfile
    container_name: student-hub-academic-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      JWT_SECRET: ${JWT_SECRET:-pica-student-hub-jwt-prod-2026}
    networks:
      - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy

  # 6. Reference Service (Privado / Sin puertos expuestos al host)
  reference-service:
    build:
      context: ./services/reference-service
      dockerfile: Dockerfile
    container_name: student-hub-reference-service
    restart: always
    networks:
      - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy

  # 7. CV Extractor Service (Privado / Sin puertos expuestos al host)
  cv-extractor-service:
    build:
      context: ./services/cv-extractor-service
      dockerfile: Dockerfile
    container_name: student-hub-cv-extractor-service
    restart: always
    networks:
      - student-hub-network

  # 8. Landing Page & FimeBot Chatbot (Privado / Sin puertos expuestos al host)
  landing:
    build:
      context: ./services/landing
      dockerfile: Dockerfile
    container_name: student-hub-landing
    restart: always
    networks:
      - student-hub-network

  # 9. StudentHUB Frontend SSR (Privado / Comunicado sólo con Nginx)
  student-hub:
    build:
      context: .
      dockerfile: services/student-hub/Dockerfile
      args:
        DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
    container_name: student-hub-frontend
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      AUTH_SERVICE_URL: http://auth-service:6770
      PROFESSORS_SERVICE_URL: http://professors-service:6771
      ACADEMIC_SERVICE_URL: http://academic-service:6772
      REFERENCE_SERVICE_URL: http://reference-service:6773
      COOKIE_SECRET: ${COOKIE_SECRET:-pica_student_hub_production_cookie_secret_2026}
    networks:
      - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      professors-service:
        condition: service_started
      academic-service:
        condition: service_started
      reference-service:
        condition: service_started
    volumes:
      - ./services/student-hub/public:/app/services/student-hub/public

  # 10. Proxy Nginx de Entrada Única (ÚNICO CONTENEDOR CON PUERTO EXPUESTO AL HOST)
  proxy:
    build:
      context: ./services/proxy
      dockerfile: Dockerfile
    container_name: student-hub-proxy
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    networks:
      - student-hub-network
    volumes:
      - proxy_cache:/var/cache/nginx
    depends_on:
      - student-hub
      - auth-service
      - professors-service
      - academic-service
      - reference-service
      - landing
      - fimebot-backend

  # 11. FimeBot: orientación institucional con fuentes verificadas, sin API de pago.
  fimebot-backend:
    build:
      context: ./services/fimebot-backend
      dockerfile: Dockerfile
    container_name: student-hub-fimebot-backend
    restart: always
    environment:
      FIMEBOT_HYBRID_ENABLED: ${FIMEBOT_HYBRID_ENABLED:-true}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-http://llm-gateway:8000/v1}
      OPENAI_MODEL: ${LLM_MODEL:-qwen-local}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
    networks:
      - student-hub-network
      - llm-apps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8043/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 12. Cloudflare Tunnel (Ingress de Producción)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: student-hub-tunnel
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
    driver: local
  proxy_cache:
    driver: local
  redis_data:
    driver: local

networks:
  llm-apps:
    external: true
  student-hub-network:
    driver: bridge
    internal: false
