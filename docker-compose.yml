services:
  postgres:
    image: postgres:15-alpine
    container_name: student-hub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-pica_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_pass}
    networks:
    - student-hub-network
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    - ./scripts/import_horarios.sql:/docker-entrypoint-initdb.d/02-import.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: student-hub-redis
    restart: always
    networks:
    - student-hub-network
    volumes:
    - redis_data:/data
  professors-service:
    build:
      context: ./services/professors-service
      dockerfile: Dockerfile
    container_name: student-hub-professors-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      JWT_SECRET: ${JWT_SECRET:-pica-student-hub-jwt-prod-2026}
      CV_EXTRACTOR_URL: http://cv-extractor-service:6774
      REFERENCE_SERVICE_URL: http://reference-service:6773
    networks:
    - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy
  academic-service:
    build:
      context: ./services/academic-service
      dockerfile: Dockerfile
    container_name: student-hub-academic-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      JWT_SECRET: ${JWT_SECRET:-pica-student-hub-jwt-prod-2026}
    networks:
    - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy
  reference-service:
    build:
      context: ./services/reference-service
      dockerfile: Dockerfile
    container_name: student-hub-reference-service
    restart: always
    networks:
    - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy
  cv-extractor-service:
    build:
      context: ./services/cv-extractor-service
      dockerfile: Dockerfile
    container_name: student-hub-cv-extractor-service
    restart: always
    networks:
    - student-hub-network
  landing:
    build:
      context: ./services/landing
      dockerfile: Dockerfile
    container_name: student-hub-landing
    restart: always
    networks:
    - student-hub-network
  student-hub:
    build:
      context: .
      dockerfile: services/student-hub/Dockerfile
      args:
        DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
    container_name: student-hub-frontend
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/${DB_NAME:-pica_db}
      AUTH_SERVICE_URL: http://portal:8080
      PROFESSORS_SERVICE_URL: http://professors-service:6771
      ACADEMIC_SERVICE_URL: http://academic-service:6772
      REFERENCE_SERVICE_URL: http://reference-service:6773
      COOKIE_SECRET: ${COOKIE_SECRET:-pica_student_hub_production_cookie_secret_2026}
    networks:
    - student-hub-network
    depends_on:
      postgres:
        condition: service_healthy
      professors-service:
        condition: service_started
      academic-service:
        condition: service_started
      reference-service:
        condition: service_started
    volumes:
    - ./services/student-hub/public:/app/services/student-hub/public
  proxy:
    build:
      context: ./services/proxy
      dockerfile: Dockerfile
    container_name: student-hub-proxy
    restart: always
    ports:
    - ${HOST_PORT:-80}:80
    networks:
    - student-hub-network
    volumes:
    - proxy_cache:/var/cache/nginx
    depends_on:
    - student-hub
    - professors-service
    - academic-service
    - reference-service
    - landing
    - fimebot-backend
    - portal
  fimebot-backend:
    build:
      context: ./services/fimebot-backend
      dockerfile: Dockerfile
    container_name: student-hub-fimebot-backend
    restart: always
    environment:
      FIMEBOT_HYBRID_ENABLED: ${FIMEBOT_HYBRID_ENABLED:-true}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway:8000/v1}
      OPENAI_MODEL: ${LLM_MODEL:-qwen-local}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
    networks:
    - student-hub-network
    - llm-apps
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8043/health',
        timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: student-hub-tunnel
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  portal:
    build: ./services/portal
    image: student-hub-portal:local
    container_name: student-hub-portal
    restart: unless-stopped
    environment:
      PORTAL_ORIGIN: https://fime.ici-labs.com
      IDENTITY_URL: http://sara-identity:8001
      AUTH_PORTAL_URL: https://auth.ici-labs.com
      REDIS_URL: redis://portal-redis:6379/0
    networks:
    - student-hub-network
    - sara-identity-clients
    - portal-network
    depends_on:
      portal-redis:
        condition: service_healthy
      fimebot-backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',
        timeout=3)
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  portal-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - portal_sessions:/data
    networks:
    - portal-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
    driver: local
  proxy_cache:
    driver: local
  redis_data:
    driver: local
  portal_sessions: {}
networks:
  llm-apps:
    external: true
  student-hub-network:
    driver: bridge
    internal: false
  portal-network:
    internal: true
  sara-identity-clients:
    external: true
